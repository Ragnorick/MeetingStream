# MeetingStream Session Config
# Personal equivalent of TalkStream's remote-english.toml

[llm]
# Options: "claude", "openai", "ollama"
provider = "claude"
# model = "claude-sonnet-4-20250514"  # default for claude
# model = "gpt-4o"                    # default for openai
# model = "llama3.1:8b"              # default for ollama

# API key (or set ANTHROPIC_API_KEY / OPENAI_API_KEY env var)
# api_key = "sk-..."  # NOT recommended in file — use env var instead

[audio]
device = "Meeting Capture"
language = "en"

# Which agents to run (must have matching .md file in agents/ directory)
agents = ["transcriber", "note-taker"]
# Add "sketch-artist" if you want architecture diagrams:
# agents = ["transcriber", "note-taker", "sketch-artist"]

[routing]
# How to classify meetings for filing:
#   "deterministic" = keyword matching only (fast, free, requires routing.toml config)
#   "agentic"       = LLM reads notes + scans folders (smart, costs ~$0.02/meeting)
#   "hybrid"        = tries keywords first, falls back to LLM if no match (recommended)
mode = "hybrid"

# Base folder where project subfolders live
# The router scans this to discover available destinations
base_path = "~/Documents/MeetingStream/Projects"

# Fallback when nothing matches
unclassified_path = "~/Documents/MeetingStream/Projects/Unclassified"

# --- For deterministic/hybrid mode: keyword rules ---
# See config/routing-example.toml for the full keyword config format.
# Copy it to routing.toml and customize for your projects.

# --- For future managed/SaaS mode ---
# [llm]
# provider = "managed"
# managed_api_url = "https://api.meetingstream.io/v1"
# managed_api_key = "ms_user_abc123"  # customer's subscription key
